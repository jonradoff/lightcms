app = 'metavert-cms'
primary_region = 'ord'

[build]

[env]
  PORT = "8082"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # Health check using dedicated endpoint
  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    path = "/health"

[http_service.http_options]
  idle_timeout = 300
  response_header_timeout = 300

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "lightcms_data"
  destination = "/app/content"
  initial_size = "1gb"
