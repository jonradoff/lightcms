# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

runtime: container
build:
  dockerfile: Dockerfile.smithery
  dockerBuildPath: "."
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - serverUrl
      - apiKey
    properties:
      serverUrl:
        type: string
        description: URL of your LightCMS instance (e.g. https://example.com or http://localhost:8082)
      apiKey:
        type: string
        description: API key for authentication. Create one in the admin panel at /cm → Settings → API Keys.
  commandFunction:
    |-
    (config) => ({ command: './lightcms-mcp', args: [], env: { LIGHTCMS_URL: config.serverUrl, LIGHTCMS_API_KEY: config.apiKey } })
