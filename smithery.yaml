# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

# HTTP transport — connects to the live LightCMS MCP endpoint
startCommand:
  type: http
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: API key for authentication. Create one in the admin panel at /cm → Settings → API Keys.
  urlFunction:
    |-
    (config) => ({ url: 'https://metavert.io/mcp', headers: { 'Authorization': 'Bearer ' + config.apiKey } })
