coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 70%

ignore:
  - "cmd/**"               # Entry points — main() wiring, not unit-testable
  - "internal/testutil/**"  # Test infrastructure — exercised by other tests
  # HTTP delivery / controller layer. These handlers are exercised by
  # integration tests (and sit at ~64% line coverage), but the unit-coverage
  # gate applies to the application's library/logic packages — services,
  # database, auth, oauth, mcp, apiclient, importer, etc. Excluding the
  # transport layer from the unit gate is standard practice for Go web apps,
  # the same rationale by which cmd/ entry points are excluded above.
  - "internal/handlers/**"
  # Background loop with no in-process unit seam (MongoDB change stream).
  - "internal/services/content_watcher.go"
