coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 70%

ignore:
  - "cmd/**"               # Entry points — main() wiring, not unit-testable
  - "internal/testutil/**"  # Test infrastructure — exercised by other tests
  # Genuinely not unit-testable in-process (background loops / external SSE
  # streaming). These are integration-tested, like cmd/ above.
  - "internal/services/content_watcher.go"  # MongoDB change-stream watcher (background)
  - "internal/handlers/chat.go"             # AI chat widget: SSE streaming to the Anthropic API
