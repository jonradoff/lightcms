version: 2

project_name: lightcms-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: lightcms-mcp
    main: ./cmd/mcp
    binary: lightcms-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: lightcms-mcp
    builds:
      - lightcms-mcp
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: jonradoff
    name: lightcms
  draft: false
  prerelease: auto
